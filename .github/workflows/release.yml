# .github/workflows/release.yml
name: Release PosEngine

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: posengine-desktop/src-tauri

      - name: Install frontend deps
        working-directory: posengine-web
        run: npm install

      - name: Build Next.js
        working-directory: posengine-web
        run: npm run build

      - name: Install Tauri deps
        working-directory: posengine-desktop
        run: npm install

      - name: Build Tauri .msi
        working-directory: posengine-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Listar bundles generados
        working-directory: posengine-desktop/src-tauri/target/release/bundle
        run: dir /s /b
        shell: cmd

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PosEngine ${{ github.ref_name }}"
          body: "Nueva versión de PosEngine"
          draft: false
          files: |
            posengine-desktop/src-tauri/target/release/bundle/msi/*.msi
            posengine-desktop/src-tauri/target/release/bundle/msi/*.msi.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          MSI_FILE=$(ls posengine-desktop/src-tauri/target/release/bundle/msi/*.msi | head -1)
          MSI_NAME=$(basename "$MSI_FILE")
          SIG=$(cat posengine-desktop/src-tauri/target/release/bundle/msi/*.msi.sig)
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "Nueva versión de PosEngine",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/wildbergerlopezk/posengine-frontend/releases/download/${{ github.ref_name }}/$MSI_NAME"
              }
            }
          }
          EOF

      - name: Upload latest.json
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}