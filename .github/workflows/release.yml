name: Release PosEngine

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: posengine-desktop/src-tauri

      - name: Install frontend deps
        working-directory: posengine-web
        run: npm install

      - name: Build Next.js
        working-directory: posengine-web
        run: npm run build

      - name: Install Tauri deps
        working-directory: posengine-desktop
        run: npm install

      - name: Sync version with tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          jq ".version = \"$VERSION\"" posengine-desktop/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json posengine-desktop/src-tauri/tauri.conf.json

      - name: Check signing env
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "NO KEY"
            exit 1
          else
            echo "KEY OK"
          fi

      - name: Debug signing env
        shell: bash
        run: |
          echo "KEY length:"
          echo "$TAURI_SIGNING_PRIVATE_KEY" | wc -c

      - name: Build Tauri .msi
        working-directory: posengine-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Listar bundles generados
        working-directory: posengine-desktop/src-tauri/target/release/bundle
        run: dir /s /b
        shell: cmd

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PosEngine ${{ github.ref_name }}"
          body: "Nueva versión de PosEngine"
          draft: false
          files: |
            posengine-desktop/src-tauri/target/release/bundle/msi/*.msi
            posengine-desktop/src-tauri/target/release/bundle/msi/*.msi.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        shell: bash
        run: |
          set -e

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          MSI_DIR="posengine-desktop/src-tauri/target/release/bundle/msi"

          MSI_FILE=$(find "$MSI_DIR" -type f -name "*.msi" | head -n 1)

          if [ -z "$MSI_FILE" ]; then
            echo "ERROR: No se encontró el .msi"
            exit 1
          fi

          MSI_NAME=$(basename "$MSI_FILE")

          SIG_FILE=$(find "$MSI_DIR" -type f -name "*.msi.sig" | head -n 1 || true)

          if [ -n "$SIG_FILE" ]; then
            SIG=$(cat "$SIG_FILE")
          else
            SIG=""
          fi

          echo "MSI: $MSI_NAME"
          echo "SIG: $SIG_FILE"

          cat <<EOF > latest.json
          {
            "version": "$VERSION",
            "notes": "Nueva version",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/wildbergerlopezk/posengine-frontend/releases/download/${{ github.ref_name }}/$MSI_NAME"
              }
            }
          }
          EOF

          cat latest.json

      - name: Upload latest.json
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}